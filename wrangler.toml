name = "getbili"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ⚠️ 当前主部署方式为 Docker 自托管（见 Dockerfile / docker-compose.yml），本文件仅用于
# pnpm deploy:cf 备用部署。两平台共享同一套代码与 Env（差异见 src/lib/policy.ts 抽象）。

# 是否允许跨域访问（默认 "true"）。部署后如需收紧，改成具体域名，如 "https://example.com"
[vars]
CORS_ORIGIN = "*"
# 默认请求超时（毫秒）
REQUEST_TIMEOUT_MS = "15000"

# 未登录时使用 try_look=1 预览高清晰度（B 站行为），默认开启
TRY_LOOK = "true"

# 实验性：伪造 X-Real-IP / X-Forwarded-For 中国 IP（借鉴 api-enhanced 对网易的手法）。
# 【2026-10-04 线上 A/B 实测结论：对 B 站无效】—— 关闭态与开启态各 3 次均为 -412，
# B 站风控以 TCP 对端真实源 IP 为准，不信任这两个头（网易信任所以 api-enhanced 有效）。
# 开关保留用于未来网关行为变化时复测，平时保持 false。
FAKE_CN_IP = "false"

# 上游出口代理（可选）。B 站对 Cloudflare Workers 出口 IP 做 IP 级风控（-412 request was banned），
# 线上直连拿不到任何数据时，把它配置为一台住宅/国内 IP 反向代理的基址（如 "https://bili.example.com"），
# 所有上游请求将改发到该地址（代理需把 Host/SNI 指回 api.bilibili.com，配置示例见 README）。
# 本地 dev（家宽 IP）无需配置，留空即直连。
# UPSTREAM_PROXY_BASE = ""

# 登录态 Cookie / 管理后台令牌请勿写在这里（会进版本库）。
# 本地开发： 写入 .dev.vars 文件 -> BILI_COOKIE="SESSDATA=xxx; bili_jct=xxx" / ADMIN_TOKEN=xxx
# 线上部署： pnpm exec wrangler secret put BILI_COOKIE / pnpm exec wrangler secret put ADMIN_TOKEN

# 接口公开策略存储。部署前需创建并回填 id：
#   pnpm exec wrangler kv namespace create POLICY_KV
# 本地 dev（wrangler dev）使用内置本地 KV 模拟，无需真实 id，占位符可直接跑。
[[kv_namespaces]]
binding = "POLICY_KV"
id = "34e68f4804a941e28b3cb0f1d7ea618e"

[observability]
enabled = true
